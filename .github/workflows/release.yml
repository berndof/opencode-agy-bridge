# Fork note: npm publishing is intentionally DISABLED in this fork.
# The package name is owned by the upstream project (raultov/opencode-agy-bridge),
# and this fork is consumed via a local path (see README "Build from source").
# Tags only trigger a build + test validation pass.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build
      - run: bun test
